  % endif

  ${ collapse_template(why_contact_info_needed_template) }
fields:  
  - Phone number: users[0].phone_number
    required: False
    datatype: al_international_phone
  - Email address: users[0].email    
    datatype: email
    required: False
  - label: |
      % if al_person_answering == "user":
      Other ways to reach you
      % else:
      Other ways to reach ${ users[0] }
      % endif
    field: users[0].other_contact_method
    input type: area
    required: False
    help: |
      If you do not have a phone number or email, tell us how to reach you.
      For example, you can use a friend's phone number. But it must be a
      friend you trust to give you the message.
validation code: |
  if (
    not showifdef("users[0].phone_number")
    and (not showifdef("users[0].mobile_number"))
    and (not showifdef("users[0].email"))
    and (not showifdef("users[0].other_contact_method"))
  ):
    validation_error(
      word("You need to provide at least one contact method."),
      field="users[0].other_contact_method",
    )
---
id: docket number
question: |
  What is the docket number for your eviction case?
fields:
  - I don't know the docket number: dont_know_docket_number
    datatype: yesno    
  - Docket number: docket_number
    hide if: dont_know_docket_number  
validation code: |
  # Set an empty docket number so downstream templates still resolve
  if dont_know_docket_number:
    docket_number = '' 
---
id: Tell Us About the Case
section: case_information
question: |
  What happened?
subquestion: |
  Briefly describe what happened. Include the date and time it happened.
fields:
  - no label: facts_description
    input type: area
---
id: What Happened
question: |
  What problems are you having?
subquestion: |
  Check any of these that match your situation.
fields:
  - 'My landlord broke the lease': violation_breach_contract
    datatype: yesno
    help: |
      Your landlord broke a rule in your lease. Or in another written
      agreement you signed.
  - 'My landlord shut off my utilities': violation_utilities
    datatype: yesno
    help: |
      This can include heat, hot water, gas, or electricity.
  - 'My home is not safe or clean enough to live in': violation_bad_conditions
    datatype: yesno
  - 'Something else': other_issues
    datatype: yesno
    help: |
      Other problems can include bad smells or loud noise that make the home
      hard to live in.
  - 'Describe the problem': other_issues_type
    datatype: text
    show if: other_issues
validation code: |
  if not violation_breach_contract and not violation_utilities and not violation_bad_conditions and not other_issues:
    validation_error("You must check at least one problem.")
help: |
  If none of these match your situation, this interview may not be right for
  you. A lawyer may be able to help you instead.
  
  <a href="https://www.mass.gov/info-details/finding-a-lawyer" target="_blank" class="btn btn-warning">Find a Lawyer</a>
---
id: Court Request
question: |
  Your request to the court
subquestion: |
  Here is what you told us:

  % if violation_breach_contract:
  * Your landlord broke your lease
  % endif
  % if violation_utilities:
  * Your landlord shut off your utilities
  % endif
  % if violation_bad_conditions:
  * Your home is not safe or clean enough to live in
  % endif

  We checked the boxes below that match your problems. Check any others you
  want to add.

fields:
  - 'Stop trying to evict me without a court order': stop_eviction
    datatype: yesno
  - 'Turn my utilities back on': utilities_needed
    datatype: yesno
    default: ${ violation_utilities }
  - 'Which utilities need to be turned back on?': utilities_needed_type
    datatype: text
    show if: utilities_needed
  - 'Make repairs to my home': stop_fail_repairs
    datatype: yesno
    default: ${ violation_bad_conditions }
  - 'Give back my belongings': stop_return_belongings
    datatype: yesno
  - 'Something else': other_court_request
    datatype: yesno
  - 'What do you want the court to do?': other_court_request_type
    datatype: text
    show if: other_court_request
