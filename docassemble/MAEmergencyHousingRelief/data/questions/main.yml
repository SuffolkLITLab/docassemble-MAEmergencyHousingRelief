terms: 
  housing emergency: |
   You cannot enter the apartment, your utilities were shut off, the apartment has become unsafe or unsanitary to live in.
  court order: |
    An offical order from a judge.
  immediate danger: |
    If you see smoke, smell gas, or notice large cracks in the cieling or floors. 
---
id: introduction to interview
continue button field: temporary_restraining_order_intro
question: |
  What does this interview do?
subquestion: |
  This interview will help you file a complaint to get emergency housing relief and issue a temporary restraining order, along with a preliminary injunction and short order notice form.

  If you are in {immediate danger}, click this button to find emergency housing resources. 

  <div class="d-flex gap-2 mt-3">
    <a href="https://www.mass.gov/orgs/emergency-housing-help-programs" class="btn btn-warning" target="_blank">Find Emergency Housing</a>
  </div>
  <br>

  ####Can you use this form?
  1. Are you facing a {housing emergency}?
  2. Did the other party without a {court order}?

  If you answered yes to the above questions, you may proceed.
  
  ####What to gather before you start
  
  * Your lease (if you are the tenant)
  * The other party's information such as their contact information and address
   
  If you do not have any of the above, you can still start the interview without them. Most people take about 15-20 minutes to complete this interview.

  ####After you finish this interview
  When you are finished, you will need to file this petition with the Court, either by eFile using a valid email address or in person with the Clerk's office.
  
  ${ collapse_template(not_right_form_template) }
---
template: not_right_form_template
subject: |
  Not the right form for you?
content: |

  If you need help but this is not an emergency situation, click the button to find a lawyer who may better assist you. 

  ${ btn_legal_services } 
---
id: emergency relief timing warning
continue button field: emergency_relief_timing_warning
continue button label: I understand
question: |
  Before you ask the court for emergency help
subquestion: |
 You can only ask for a **Temporary Restraining Order** or a **Short Order
  of Notice** at the same time you file this complaint. They are part of
  starting your case. You cannot add them to a case later.

  A **Preliminary Injunction** is different. You can ask for one when you
  file this complaint, or later while your case is still open.
---
id: assessment temporary restraining order
question: |
  Do you need an immediate court order?
subquestion: |
  A judge can issue an order telling the other party to stop doing something right away.
  
  This can happen if you can show the court that you would face immediate harm or harm that cannot be undone if you had to wait for the other party to respond. 
  
fields:
  - 'Does this sound like a harm you would face?': emergency_today
    datatype: yesnoradio
---
id: issue a tro
question: |
  It sounds like you may need a Temporary Restraining Order 
subquestion: |
  ## What is a Temporary Restraining Order?
  An emergency court order telling the other party to stop doing something illegal or to fix a dangerous problem in the home right away. 

  **How long does it last?**
  A TRO works fast, but it only lasts for **10 days.** 
  
  **What happens after the 10 days?**
  After that, both parties will need to go to a court hearing where you can request a preliminary injunction if you need a longer restraining order. 

  ${ collapse_template(extend_a_tro_template) }

fields:
  - 'Do you want to request a TRO?': issue_a_tro
    datatype: yesnoradio
---
id: assessment fast hearing
question: |
  Do you need a judge to hear your case in the next few days?
subquestion: |
  Normally, court hearings take several weeks to schedule, but you can request to get your case heard sooner. 

  You will need to show the court that you will face immediate harm if you do not see the judge quickly. 
  
fields:
  - 'Is this something you can show?': emergency_soon_hearing
    datatype: yesnoradio
---
id: issue a short order of notice
question: |
  It sounds like you may need a Short Order of Notice
subquestion: |
  ## What is a Short Order of Notice?
  A Short Order of Notice can be used to bypass standard court timelines when a matter is urgent. 
  
  If you are facing an emergency, and cannot wait the standard amount of time you can request the court to shorten the waiting period, allowing the judge to hear your emergency request much sooner.

fields:
  - 'Do you want to request a Short Order of Notice?': issue_a_son
    datatype: yesnoradio
---
template: extend_a_tro_template
subject: |
  Can you extend a TRO?
content: |
  The order lasts no more than 10 days. A judge can extend it for another 10 days if there is a good reason or if your landlord agrees to extend it.
---
id: assessment ongoing protection
question: |
  Do you need ongoing protection?
subquestion: |
  You may ask the judge for a prolonged restraining order  which can last longer than the 10 days from a temporary restraining order. 

fields:
  - 'Does this sound like something you would need?': emergency_ongoing_protection
    datatype: yesnoradio
---
terms:
  notify: |
    By writing or orally
---
id: request a preliminary injunction
question: |
  It sounds like you may need to request a Preliminary Injunction
subquestion: |
  ## What is a Preliminary Injunction?
  An extended court order that tells the other party to stop a harmful action. 

  **How is it different from a Temporary Restraining Order?**
  You must {notify} your landlord of this legal action and the injunction may last longer than 10 days.   
  
fields:
  - 'Do you want to request a Preliminary Injunction?': request_a_pi
    datatype: yesnoradio
---
id: Mass Civ Pro
mandatory: false
question: |
  Which of the following options (if any) would you like to ask the court to do?
subquestion: |
  We have already checked the boxes that make sense based on your earlier
  answers, but you should review and make any changes as needed.
  
fields:
  - 'Issue a Temporary Restraining Order (valid for 10 days only; may be requested without immediate notice to the other side)': issue_tro
    datatype: yesno
    default: ${ issue_a_tro }
    
  - 'Request a Preliminary Injunction (may be issued for longer than 10 days; notice to the other side is required)': request_pi
    datatype: yesno
    default: ${ request_a_pi }
    
  - 'Issue a Short Order of Notice (a shortened notice period to the other side so the Court can hear this request)': issue_son
    datatype: yesno
    default: ${ issue_a_son }
