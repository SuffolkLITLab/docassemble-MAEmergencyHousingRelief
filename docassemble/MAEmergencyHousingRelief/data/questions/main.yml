terms: 
  housing emergency: |
    You are locked out of your home. Or your utilities are shut off. Or your
    home is not safe or clean enough to live in.
  court order: |
    An official order from a judge.
  immediate danger: |
    You see smoke, smell gas, or notice large cracks in the ceiling or floors.
---
id: introduction to interview
continue button field: temporary_restraining_order_intro
question: |
  What does this interview do?
subquestion: |
  This interview helps you ask the court for emergency housing relief. It can
  also make three other forms if you need them: a temporary restraining order,
  a preliminary injunction, and a short order of notice.

  If you are in {immediate danger}, use this button to find emergency housing
  help.

  <div class="d-flex gap-2 mt-3">
    <a href="https://www.mass.gov/orgs/emergency-housing-help-programs" class="btn btn-warning" target="_blank">Find Emergency Housing</a>
  </div>
  <br>

  #### Can you use this form?

  1. Are you facing a {housing emergency}?
  2. Did your landlord do this without a {court order}?

  If you answered yes to both questions, you can go on.

  #### What to gather before you start

  * Your lease, if you have one
  * Your landlord's name, address, phone number, and email

  You can still start without these. Most people finish in 10 to 20 minutes.

  #### After you finish this interview

  You must file this form with the court. You can file it online with a valid
  email address. Or you can bring it to the clerk's office in person.
  
  ${ collapse_template(not_right_form_template) }
---
template: not_right_form_template
subject: |
  Not the right form for you?
content: |
  Is this not an emergency? A lawyer may be able to help you instead.

  ${ btn_legal_services } 
---
id: emergency relief timing warning
continue button field: emergency_relief_timing_warning
continue button label: I understand
question: |
  Before you ask the court for emergency help
subquestion: |
  You can only ask for a **temporary restraining order** or a **short order
  of notice** when you file this complaint. They are part of starting your
  case. You cannot add them later.

  A **preliminary injunction** is different. You can ask for one now. You can
  also ask for one later, while your case is open.
---
id: assessment temporary restraining order
question: |
  Do you need an immediate court order?
subquestion: |
  A judge can order your landlord to stop doing something right away.

  To get this, you must show the court one of two things. You would be harmed
  right away. Or the harm could not be undone if you had to wait for your
  landlord to respond.
fields:
  - 'Can you show one of these things?': emergency_today
    datatype: yesnoradio
---
id: issue a tro
question: |
  It sounds like you may need a Temporary Restraining Order
subquestion: |
  ## What is a temporary restraining order?

  It is an emergency court order. It tells your landlord to stop breaking the
  law or to fix a danger in your home right away.

  **How long does it last?**

  Only 10 days.

  **What happens next?**

  Both sides go to a court hearing. There you can ask for a preliminary
  injunction if you need more time.

  ${ collapse_template(extend_a_tro_template) }

fields:
  - 'Do you want to request a TRO?': issue_a_tro
    datatype: yesnoradio
---
id: assessment fast hearing
question: |
  Do you need a judge to hear your case in the next few days?
subquestion: |
  Court hearings usually take one to two weeks to schedule. But you can ask the
  court to hear your case sooner.

  You will need to show the court that you will be harmed right away if you do
  not see the judge quickly.
fields:
  - 'Is this something you can show?': emergency_soon_hearing
    datatype: yesnoradio
---
id: issue a short order of notice
question: |
  It sounds like you may need a Short Order of Notice
subquestion: |
  ## What is a short order of notice?

  It makes the court act faster than usual.

  Normally you wait one to two weeks for a hearing. If you cannot wait that long, you can
  ask the court to cut the wait. Then a judge can hear your case much sooner.

fields:
  - 'Do you want to request a Short Order of Notice?': issue_a_son
    datatype: yesnoradio
---
template: extend_a_tro_template
subject: |
  Can you extend a TRO?
content: |
  The order lasts no more than 10 days. A judge can add 10 more days if there
  is a good reason. Your landlord can also agree to give you more time.
---
id: assessment ongoing protection
question: |
  Do you need ongoing protection?
subquestion: |
  You can ask the judge for a longer restraining order. It can last more than
  the 10 days a temporary restraining order gives you.

fields:
  - 'Does this sound like something you need?': emergency_ongoing_protection
    datatype: yesnoradio
---
terms:
  notify: |
    Tell them in writing or in person.
---
id: request a preliminary injunction
question: |
  It sounds like you may need to request a Preliminary Injunction
subquestion: |
  ## What is a preliminary injunction?

  It is a court order that tells your landlord to stop causing harm.

  **How is it different from a temporary restraining order?**

  You must {notify} your landlord that you asked for it. It can also last
  longer than 10 days.

fields:
  - 'Do you want to request a Preliminary Injunction?': request_a_pi
    datatype: yesnoradio
