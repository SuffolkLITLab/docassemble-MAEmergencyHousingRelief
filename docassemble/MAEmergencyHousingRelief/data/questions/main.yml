    input type: area
---
id: What Happened
question: |
  What problems are you having?
subquestion: |
  Select any of the following that apply to your situation.
fields:
  - 'The contract was breached': violation_breach_contract
    datatype: yesno
    help: |
      The other party did not follow the terms of the lease, addendum, or other contractual document between you two. 
  - 'The utilities were interfered with': utilities_needed
    datatype: yesno
  - 'The home has unsafe or unsanitary conditions': violation_bad_conditions
    datatype: yesno
  - 'Other': other_issues
    datatype: yesno
    help: |
      Other issues may include odor or noise that would make the home unlivalbe. 
  - 'Description': other_issues_type
    datatype: text
    show if: other_issues
validation code: |
  if not violation_breach_contract and not utilities_needed and not violation_bad_conditions and not other_issues:
    validation_error("You must select at least one incident.")
help: |
  If none of these sound like your situation, this interview may not apply to you. Find resources that may best assist you.
  
  <a href="https://www.mass.gov/info-details/finding-a-lawyer" target="_blank" class="btn btn-warning">Find a Lawyer</a>
---
id: Court Request
question: |
  Your request to the Court
subquestion: |
  Based on what you told us:

  % if violation_breach_contract:
  * Your contract was breached
  % endif
  % if utilities_needed:
  * Your utilities were interfered with
  % endif
  % if violation_bad_conditions:
  * The home has unsafe or unsanitary conditions
  % endif

  We have checked what you may want the Court to order the other party to do. Review the selection and check any others you would like to add.

fields:
  - 'Stop trying to evict me without court order': stop_eviction
    datatype: yesno
  - 'Provide utilities to the home': utilities_needed
    datatype: yesno
    default: ${ utilities_needed }
  - 'What utilities need to be restored?': utilities_needed_type
    datatype: text
    show if: utilities_needed
  - 'Make repairs to my home': stop_fail_repairs
    datatype: yesno
    default: ${ violation_bad_conditions }
  - 'Return my belongings': stop_return_belongings
    datatype: yesno
  - 'Other request for the court': other_court_request
    datatype: yesno
  - 'What do you want the court to do?': other_court_request_type
    datatype: text
    show if: other_court_request
---
id: Your Request
question: |
  Your Request
mandatory: false
subquestion: |
  You told us about the following problems:

  % if violation_breach_contract:
  * Your landlord breached your lease agreement
  % endif
  % if utilities_needed:
  * Your landlord shut off your utilities or did not pay for utilities they 
  are required to pay
  % endif
  % if violation_bad_conditions:
  * Your landlord breached your implied warranty of habitability by not making necessary repairs
  % endif  

  **Based on what you told us, tell the court exactly what you want your landlord to do or stop doing.**

fields: 
 - no label: plaintiff_request
   datatype: area
